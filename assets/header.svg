<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">King Vaughan</title>
  <desc id="desc">A black, softly raised header with fine muted-gold light, restrained pixel details, and the words King Vaughan, Games, tools, music, and creative software, and Royal Rogue.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#242424" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#7F6600" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#7F6600" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#000000"/>

  <path d="M34 18H1166L1182 34V326L1166 342H34L18 326V34Z" fill="#080808" filter="url(#shadow)"/>
  <path d="M34 18H1166L1182 34V326L1166 342H34L18 326V34Z" fill="url(#surface)" stroke="#181818" stroke-width="2"/>
  <path d="M48 34H1152L1166 48V312L1152 326H48L34 312V48Z" fill="#000000" stroke="#202020"/>

  <path d="M48 34H188M1012 34H1152" fill="none" stroke="#7F6600" stroke-width="2" opacity="0.72" filter="url(#glow)"/>
  <path d="M48 326H188M1012 326H1152" fill="none" stroke="#7F6600" stroke-width="2" opacity="0.38"/>

  <g fill="#7F6600" filter="url(#smallGlow)">
    <rect x="48" y="52" width="5" height="5"/>
    <rect x="58" y="52" width="3" height="3" opacity="0.55"/>
    <rect x="1147" y="303" width="5" height="5"/>
    <rect x="1139" y="305" width="3" height="3" opacity="0.55"/>
  </g>

  <path d="M194 104H470M730 104H1006" fill="none" stroke="#1D1D1D"/>
  <path d="M470 104H526M674 104H730" fill="none" stroke="#7F6600" stroke-width="2" opacity="0.7" filter="url(#smallGlow)"/>

  <text x="600" y="111" fill="#A8A8A8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="6" text-anchor="middle">ROYAL ROGUE</text>
  <text x="600" y="198" fill="#E6E6E6" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="10" text-anchor="middle">KING VAUGHAN</text>
  <text x="600" y="248" fill="#A8A8A8" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="1.5" text-anchor="middle">Games, tools, music, and creative software.</text>

  <g fill="#7F6600" opacity="0.8" filter="url(#smallGlow)">
    <rect x="548" y="286" width="8" height="8"/>
    <rect x="568" y="286" width="8" height="8" opacity="0.55"/>
    <rect x="588" y="286" width="24" height="8"/>
    <rect x="624" y="286" width="8" height="8" opacity="0.55"/>
    <rect x="644" y="286" width="8" height="8"/>
  </g>
</svg>
